[package]
name = "WorldWithoutAnime"
version = "0.1.0"
edition = "2021"

[profile.release]
debug = true

[dependencies]
bevy = "0.15.2"
byteorder = "1.5.0"
csv = "1.3.1"
full = "0.3.0"
kdtree = "0.7.0"
nalgebra = "0.33.2"
rand = "0.9.0"
serde = { version = "1.0.218", features = ["derive"] }
tokio = {version = "1.43.0", features = ["macros", "rt-multi-thread", "full"]}

